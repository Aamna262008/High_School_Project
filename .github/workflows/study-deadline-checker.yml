name: Study Deadline Checker tests

on:
  push:
    paths:
      - 'high_schooler_project/claude_projects/study_deadline_checker/**'
      - '.github/workflows/study-deadline-checker.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: high_schooler_project/claude_projects/study_deadline_checker
    steps:
      - name: Get repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
